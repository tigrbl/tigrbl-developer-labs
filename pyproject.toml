[project]
name = "tigrbl-developer-lessons"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "tigrbl==0.4.5",
  "tigrcorn==0.3.18",
  "httpx>=0.28,<0.29",
  "websockets>=15,<17",
  "pytest>=8,<10",
  "pygments>=2.19,<3",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "ruff>=0.15,<1",
]

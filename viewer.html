<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tigrbl developer lab</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--fg:#0f172a;--muted:#475569;--line:#cbd5e1;--accent:#047857;--cyan:#0369a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.45 'Segoe UI',system-ui}.night{--bg:#020617;--panel:#101d31;--fg:#f8fafc;--muted:#cbd5e1;--line:#334155;--accent:#6ee7b7;--cyan:#67e8f9}main{width:1120px;margin:0 auto;padding:32px 10px}header{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--line);padding-bottom:20px}header img{width:55px;height:55px}header strong{font-size:23px;color:var(--cyan)}.stamp{margin-left:auto;font-size:17px;color:var(--muted)}h1{font-size:44px;line-height:1.12;margin:28px 0 14px;max-width:1050px}.deck{font-size:21px;color:var(--muted);margin-bottom:20px}.toolbar{display:flex;align-items:center;gap:16px;margin:20px 0}button,a{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--cyan);padding:9px 15px;border-radius:9px;text-decoration:none}#status{font-weight:700;color:var(--accent);margin-left:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px;overflow:hidden;margin-bottom:18px}.box h2{font-size:22px;color:var(--cyan);margin:0 0 15px}.kind{text-transform:uppercase;font-size:14px;color:var(--muted);letter-spacing:1px}pre{white-space:pre;tab-size:4;overflow-wrap:normal;font:17px/1.48 Consolas,monospace;margin:10px 0 0;max-height:690px;overflow:auto}#code pre{font-size:15px;line-height:1.6}.sourcegrid{grid-template-columns:640px 440px}.assert{padding:9px 0;border-bottom:1px solid var(--line);font-size:18px}.pass{color:var(--accent);font-weight:700}.small{font-size:16px;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;font-size:17px;color:var(--muted)}.error{color:#dc2626}.record{margin-bottom:18px}.record pre{max-height:380px;font-size:15px}.trace pre{max-height:450px}h3{font-size:20px;margin:8px 0}
pre,.shell{background:#0d192d;color:#e5edff;border-radius:10px;padding:16px;font-family:Consolas,monospace}.shell{font-size:17px;padding:4px 9px}.k,.kn,.kd,.ow,.kc{color:#c6a5ff}.nf,.nc,.nb{color:#7bdcff}.s,.s1,.s2,.sa,.sd{color:#a5ebba}.m,.mi,.mf{color:#ffd497}.nt{color:#7bdcff}.c,.c1,.cm{color:#8ca5be}.o{color:#ffd497}.p{color:#e5edff}pre span{white-space:pre}.route{font-family:Consolas,monospace;background:#0d192d;color:#a5ebba;padding:5px 8px;border-radius:6px}.route .verb{color:#c6a5ff}.assert{display:flex;gap:12px;align-items:baseline}.pass{font-size:15px;letter-spacing:.04em}
</style><main><header><img src="/lab/brand.png" alt="Tigrbl bull mark"><strong>TIGRBL / DEVELOPER LABS</strong><span class="stamp">Actual live execution · companion lesson tooling</span></header><h1 id="title">Loading lesson</h1><div class="deck" id="deck">Run the source. Inspect the result.</div><div class="toolbar"><button id="run">Run lab</button><a id="view1">Results</a><a id="view2">Trace / assertions</a><span id="status">Not run</span></div><div id="summary" class="small"></div><div id="body"></div><footer><span><code class="shell"><span class="nb">uv</span> <span class="k">add</span> <span class="s">tigrbl</span></code> | served by Tigrcorn</span><span id="runtime">Pinned, reproducible lesson environment</span></footer></main>
<script>
const n=Number(location.pathname.split('/').pop()),view=new URLSearchParams(location.search).get('view')||'1';
if(n%2===0)document.body.classList.add('night');document.querySelector('#view1').href='/lab/'+n+'?view=1';document.querySelector('#view2').href='/lab/'+n+'?view=2';
const titles=['From an empty folder to a responding app','Build the smallest useful table','Registration changes the application surface','Make the app contract inspectable','One column, three contracts','Trace a field from input to output','Return a value you do not store','Make invalid input visible','Your first op_ctx operation','Member or collection?','bind is not bindings','A custom target changes which code runs','Bind one rule to the right operations','core, dispatch, invoke','Trace a hook’s phase, not just its name','One operation rule, two protocol calls','Custom operations inside WebSocket frames','Change framing; verify the boundary','Horizontal: one operation across phases','Vertical: events in one interaction','Read the horizontal–vertical matrix','A visible phase is not automatically hookable','Scope a hook to the event you mean','Build it, call it, inspect it'];
document.querySelector('#title').textContent=String(n).padStart(2,'0')+'. '+titles[n-1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pretty(x){return JSON.stringify(x,null,4)}
function jsonSyntax(x){return esc(pretty(x)).replace(/(&quot;(?:(?!&quot;).)*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g,(m,str,key,lit,num)=>str?'<span class="'+(key?'nt':'s2')+'">'+str+'</span>'+(key||''):lit?'<span class="kc">'+lit+'</span>':'<span class="mi">'+num+'</span>');}
function label(x){const m=x.match(/^(GET|POST|PATCH|PUT|DELETE) (.*)$/);return m?'<span class="route"><span class="verb">'+m[1]+'</span> '+esc(m[2])+'</span>':esc(x)}
async function run(){document.querySelector('#status').textContent='RUNNING';document.querySelector('#run').disabled=true;const [r,s]=await Promise.all([fetch('/lab/run/'+n,{method:'POST'}),fetch('/lab/source/'+n)]);const data=await r.json(),source=await s.json();
document.querySelector('#status').textContent=data.passed?'VERIFIED · '+data.checks.length+' assertions':'FAILED';document.querySelector('#runtime').textContent=data.runtime||'See failure';document.querySelector('#summary').textContent='Lesson '+n+' · '+(data.recorded_at||'')+' · '+(data.elapsed_seconds||0)+' s · '+(view==='1'?'Results view':'Trace / assertion view');
if(!data.passed){document.querySelector('#body').innerHTML='<pre class="error">'+jsonSyntax(data)+'</pre>';document.querySelector('#run').disabled=false;return}
const checks='<div class="box"><h2>Observed assertions</h2>'+data.checks.map(x=>'<div class="assert"><span class="pass">PASS</span> '+esc(x.assertion)+'</div>').join('')+'</div>';
const records=data.records.map((x,i)=>'<div class="record"><div class="kind">'+esc(x.kind)+'</div><h3>'+label(x.label)+'</h3><pre>'+(data.formatted_records?.[i]||jsonSyntax(x.value))+'</pre></div>');
if(view==='1')document.querySelector('#body').innerHTML='<div class="grid sourcegrid"><div class="box" id="code"><h2>Executed lesson source</h2><pre>'+source.highlighted+'</pre></div><div><div class="box"><h2>Captured result</h2>'+records.slice(0,2).join('')+'</div>'+checks+'</div></div>';
else document.querySelector('#body').innerHTML=checks+'<div class="grid"><div class="box trace"><h2>Actual teaching trace</h2><pre>'+(data.formatted_trace||jsonSyntax(data.trace))+'</pre><p class="small">Instrumentation records hook/handler calls. It is not a native production trace viewer.</p></div><div class="box"><h2>Additional inspected evidence</h2>'+records.slice(-2).join('')+'</div></div>';
document.querySelector('#run').disabled=false;
}document.querySelector('#run').onclick=run;run();
</script></html>
